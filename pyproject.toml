[project]
name = "hebrew-live-cli"
version = "0.1.0a1"
description = "Offline Hebrew live captions and local translation on Apple Silicon with MLX/Metal"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mlx-whisper==0.4.3",
    "mlx-lm==0.31.3",
    "onnxruntime==1.29.0",
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "rich==15.0.0",
    "huggingface-hub==1.30.0",
    "python-bidi==0.6.11",
]
[dependency-groups]
desktop-build = [
    "pyinstaller==6.22.3",
    "pyobjc-framework-avfoundation==12.2.2",
]
[project.scripts]
he-ru = "hebrew_live.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/hebrew_live"]
[tool.hatch.build.targets.sdist]
include = [
    "/src/hebrew_live",
    "/tests",
    "/pyproject.toml",
    "/uv.lock",
    "/constraints.txt",
    "/README.md",
    "/README.ru.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/PRIVACY.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/run.sh",
    "/docs",
]
