name: public-alpha-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-export-package-smoke:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: experiments/publication-ui-preview/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify supported runner architecture
        run: test "$(uname -m)" = arm64
      - name: Build and verify a clean public export
        run: python3 scripts/ci_clean_smoke.py
